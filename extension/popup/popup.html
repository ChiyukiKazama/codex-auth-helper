<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex 登录助手</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app-container">
    <!-- 头部区域 -->
    <header class="app-header">
      <div class="logo-container">
        <div class="logo-glow"></div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
        <div class="logo-text">
          <h1>Codex 登录助手</h1>
          <span class="logo-sub">Codex Auth Helper v1.2.0</span>
        </div>
      </div>
    </header>

    <!-- 主体内容区 -->
    <main class="app-main">

      <!-- 加载中状态 -->
      <div id="state-loading" class="state-container active">
        <div class="loader">
          <div class="loader-ring"></div>
          <div class="loader-dot"></div>
        </div>
        <p class="loading-text">正在准备登录...</p>
      </div>

      <!-- 未登录状态 -->
      <div id="state-unauthorized" class="state-container">
        <div class="alert-icon-container">
          <svg class="alert-icon animate-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <h2 class="state-title">使用 Codex 官方登录</h2>
        <p class="state-desc">完成官方登录后，扩展会自动接收回调并下载 auth.json。请按登录页面提示完成账户验证。</p>
        <button id="btn-oauth-start-unauthorized" class="btn-primary ripple" type="button">
          开始官方登录并自动下载
        </button>
      </div>

      <section id="oauth-status-panel" class="oauth-callback-panel" role="status" aria-live="polite" hidden>
        <h3>自动登录与下载状态</h3>
        <p id="oauth-status-message"></p>
      </section>

    </main>

    <!-- 安全声明页脚 -->
    <footer class="app-footer">
      <div class="safety-badge">
        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        <span>直连官方认证站点 • 本地导出文件</span>
      </div>
    </footer>

    <!-- 动态 Toast 反馈 -->
    <div id="toast" class="toast-container">
      <div class="toast-content">
        <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        <span id="toast-message">操作成功</span>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>

</html>
